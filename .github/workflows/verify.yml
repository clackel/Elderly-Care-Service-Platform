name: Verify framework
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        working-directory: backend
        run: mvn -B -ntp verify
  backend-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_DATABASE: elder_module_test
          MYSQL_ROOT_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify elder persistence and concurrency on MySQL
        working-directory: backend
        env:
          ELDER_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/elder_module_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
          ELDER_TEST_DB_USERNAME: root
          ELDER_TEST_DB_PASSWORD: ci-test-only
          ELDER_TEST_DB_DRIVER: com.mysql.cj.jdbc.Driver
        run: mvn -B -ntp -Dtest=ElderProfileIntegrationTest test
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/admin-web/package-lock.json
      - name: Install, lint, test and build
        working-directory: frontend/admin-web
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm test
          npm run build
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json
      - name: Install, type-check and build both targets
        working-directory: frontend/mobile
        run: |
          npm ci
          npm run format:check
          npm run type-check
          npm run build:h5
          npm run build:mp-weixin
