spring:
  application:
    name: elderly-care-service-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/elderly_care?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:elderly_care}
    password: ${DB_PASSWORD}
  jackson:
    time-zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  session:
    redis:
      namespace: elderly-care:session
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:elderly_care}
    password: ${RABBITMQ_PASSWORD}
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: ELDERLY_CARE_SESSION
        http-only: true
        secure: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  elder:
    encryption-key: ${ELDER_DATA_KEY:}
  integrations:
    wechat-app-id: ${WECHAT_APP_ID:}
    wechat-app-secret: ${WECHAT_APP_SECRET:}
    storage-endpoint: ${STORAGE_ENDPOINT:}
    storage-bucket: ${STORAGE_BUCKET:}
    notification-provider: ${NOTIFICATION_PROVIDER:unconfigured}
