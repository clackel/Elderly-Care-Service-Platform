# Only synthetic data. Explicitly select dev; never deploy this profile publicly.
spring:
  datasource:
    url: jdbc:h2:file:./.data/elderly_care;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  data:
    redis:
      password: ""
  rabbitmq:
    password: ${RABBITMQ_PASSWORD:}
server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        secure: false
management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
app:
  dev-password: ${APP_DEV_PASSWORD:}
